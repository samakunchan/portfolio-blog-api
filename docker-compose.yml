version: '3.8'

services:
  server:
    container_name: server
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:8000"
    volumes:
      - ./:/var/www/html
    networks:
      - my-network

  postgres-server:
    container_name: postgres-server-api
    image: "postgres:13.2"
    environment:
#      POSTGRES_DB: ${POSTGRES_DB} Je préfère créer ma base de donnée en CLI. Mais le choix est libre.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - data_volume-api:/var/lib/postgresql/data/
      - sql_volume-api:/docker-entrypoint-initdb.d/:ro
    ports:
      - "5435:5432"
    networks:
      - my-network

  pgadmin:
    container_name: pgadmin-api
    image: "dpage/pgadmin4:6.15"
    environment:
#      POSTGRES_DB: ${POSTGRES_DB} Je préfère créer ma base de donnée en CLI. Mais le choix est libre.
      POSTGRES_HOST: postgres-server
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5055:80"
    depends_on:
      - postgres-server
    networks:
      - my-network

